<!DOCTYPE html>
<html lang="pt-pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Currículo - Login</title>

    <link rel="stylesheet" href="css/login.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>

<body>
    <main class="conteudo-principal">

        <section class="lado-esquerdo">
            <div class="container-login">

                <div class="logo">
                    <img src="img/pasta.png" alt="Ícone" class="icone-titulo"> Meu <span>Currículo</span>
                </div>

                <p class="subtitulo">Apresentação de habilidades, tecnologias e projetos desenvolvidos ao longo da
                    graduação em Engenharia de Software.</p>

                <form id="formLogin">
                    <div class="grupo-input">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="usuario" placeholder="Usuário" autocomplete="off">
                    </div>

                    <div class="grupo-input">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="senha" placeholder="Palavra-passe">
                    </div>

                    <button type="submit" id="btn-entrar">
                        Entrar <i class="fa-solid fa-arrow-right"></i>
                    </button>

                </form>

                <p class="rodape-login">Projeto de Portfólio</p>
            </div>
        </section>

        <section class="lado-direito">

            <div class="overlay-texto">
                <p>Grandes conquistas<br>começam com um<br><span class="destaque">bom login.</span></p>
            </div>

        </section>

    </main>

    <script src="js/login.js"></script>
</body>

</html>
